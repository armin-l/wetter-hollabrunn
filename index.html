<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <title>Wetter Hollabrunn</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- E-Ink optimiert: grosser Kontrast, Serif Fonts, keine Animationen -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Georgia, 'Times New Roman', serif; background:#fff; color:#000; line-height:1.7; max-width:740px; margin:0 auto; padding:24px; }

        h1 { text-align:center; font-size:2em; letter-spacing:2px; margin-bottom:4px; }
        .untertitel { text-align:center; font-size:.95em; color:#333; margin-bottom:28px; }

        /* Aktuelle Wetter-Karten */
        .karten { display:flex; flex-wrap:wrap; gap:16px; justify-content:center; }
        .karte { flex:1 1 130px; max-width:170px; text-align:center; border:2px solid #aaa; padding:16px 10px; background:#fafafa; }
        .karte-titel { font-weight:bold; font-size:.85em; color:#444; margin-bottom:6px; }
        .karte-wert { font-size:2.2em; font-weight:bold; white-space:nowrap; }
        .einheit { font-size:.45em; vertical-align:super; color:#555; }

        /* Vorhersage-Tabelle */
        table { width:100%; border-collapse:collapse; margin-top:32px; }
        th { background:#eee; padding:10px 8px; text-align:left; font-size:.9em; border-bottom:2px solid #999; }
        td { padding:10px 8px; border-bottom:1px solid #ddd; font-size:1em; }
        tr:last-child td { border-bottom:none; }
        .tag-name { font-weight:bold; white-space:nowrap; min-width:8ch; }
        .temp-balken { display:inline-block; min-width:5ch; }

        footer { text-align:center; margin-top:36px; font-size:.8em; color:#888; }
    </style>
</head>
<body>

<h1>&#x26C1; Wetter Hollabrunn</h1>
<p class="untertitel" id="datum">Lade Daten...</p>

<div class="karten" id="aktuell"></div>

<table>
    <thead><tr>
        <th>Tag</th>
        <th>T &deg;C</th>
        <th>Niederschlag mm</th>
        <th>Sonne h</th>
    </tr></thead>
    <tbody id="vorhersage"></tbody>
</table>

<footer>Daten: Open-Meteo API · Stand: <span id="stand"></span></footer>

<script type="application/javascript">(function(){
    var LAT = 48.32, LON = 15.79;
    var URL = 'https://api.open-meteo.com/v1/forecast' +
        '?latitude=' + LAT + '&longitude=' + LON +
        '&current=temperature_2m,relative_humidity_2m,wind_speed_10m' +
        '&daily=temperature_max,temperature_min,sunrise,sunset,precipitation_sum,sunshine_duration' +
        '&timezone=Europe%2FVienna&forecast_days=7';

    function laden() {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', URL, true);
        xhr.onload = function () {
            if (xhr.status === 200) { anzeigen(JSON.parse(xhr.responseText)); }
            else { document.getElementById('aktuell').innerHTML='<p style="padding:20px;">Fehler beim Laden.</p>'; }
        };
        xhr.onerror = function () { document.getElementById('aktuell').innerHTML='<p style="padding:20px;">Netzwerkfehler.</p>'; };
        xhr.send();
    }

    function anzeigen(d){
        var c=d.current, now=new Date(), tbody='', i, maxT, minT, sonneH;

        // Datum und Uhrzeit
        document.getElementById('datum').textContent = now.toLocaleDateString('de-DE',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
        document.getElementById('stand').textContent = now.toLocaleTimeString('de-AT');

        // Aktuelle Werte
        document.getElementById('aktuell').innerHTML =
            '<div class="karte">'
                +'<div class="karte-titel">Temperatur</div>'
                +'<div class="karte-wert">'+Math.round(c.temperature_2m)+'<span class="einheit">&deg;C</span></div>'
            +'</div>'
            +'<div class="karte">'
                +'<div class="karte-titel">Luftfeuchte</div>'
                +'<div class="karte-wert">'+c.relative_humidity_2m+'<span class="einheit">%RH</span></div>'
            +'</div>'
            +'<div class="karte">'
                +'<div class="karte-titel">Wind</div>'
                +'<div class="karte-wert">'+Math.round(c.wind_speed_10m)+'<span class="einheit">km/h</span></div>'
            +'</div>';

        // Tägliche Vorhersage
        i=0;i<d.daily.time.length;i++){
            var datumStr = d.daily.time[i];
            var dt = new Date(datumStr.split('-')[0], parseInt(datumStr.split('-')[1])-1, parseInt(datumStr.split('-')[2]));
            var tagName = (i===0)?'Heute':dt.toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'});
            maxT=Math.round(d.daily.temperature_max[i]);
            minT=Math.round(d.daily.temperature_min[i]);
            if(d.daily.sunshine_duration && d.daily.sunshine_duration[i]){
                sonneH=Math.round((d.daily.sunshine_duration[i]/3600)*10)/10;
            } else {
                sonneH=null;
            }
            tbody+='<tr><td class="tag-name">'+tagName+'</td>'
                +'<td><span class="temp-balken">'+minT+'&deg;/ '+maxT+'&deg;</span></td>'
                +'<td>'+d.daily.precipitation_sum[i]+' mm</td>'
                +'<td>'+(sonneH!==null?sonneH+' h':'&mdash;')+'</td>'
                +'</tr>';
        }
        document.getElementById('vorhersage').innerHTML=tbody;
    }

    laden();
})();
</script>

</body>
</html>
