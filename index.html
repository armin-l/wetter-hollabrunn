<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>Lokale Zeit Hollabrunn AT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Geneva,sans-serif;background:#f7fafc;color:#1a202e;text-align:center;font-size:14px;line-height:1.5;}
h1{font-size:1.6em;margin-bottom:4px}
.hinweis{color:#718096;font-style:italic;font-size:.85em;margin-bottom:15px}
.clock-wrap{display:inline-block;border-radius:50%;background:#fff;box-shadow:0 4px 16px rgba(0,0,.1);padding:10px;margin-bottom:15px;width:auto;height:auto;display:flex;justify-content:center;}
.info-row{display:flex;gap:15px;flex-wrap:wrap;justify-content:center;margin-bottom:15px;}
.card{background:#fff;border-radius:8px;padding:10px 18px;box-shadow:0 2px 6px rgba(0,0,.06);}
.card-label{font-size:.75em;color:#a0aec0;text-transform:uppercase;letter-spacing:1px;}
.card-wert{font-size:1.3em;font-weight:bold;margin-top:2px;}
.footer{text-align:center;color:#cbd5e0;font-size:.7em;margin-top:15px;}
svg text{font-family:'Segoe UI',Tahoma,sans-serif;}
@media(max-width:600px){.info-row{flex-direction:column;align-items:center;}.card{width:80%;}}
</style>
</head>
